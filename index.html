<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax Shorts AI - Ücretsiz YouTube Kesit & Shorts Üretici</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #09090b; color: #fff; display: flex; justify-content: center; padding: 15px; margin: 0; }
  .box { background: #141418; padding: 22px; border-radius: 18px; width: 100%; max-width: 460px; border: 1px solid #27272a; text-align: center; box-shadow: 0 10px 30px rgba(239,68,68,0.12); }
  h1 { color: #ff3b30; margin: 0 0 4px 0; font-size: 25px; letter-spacing: 1px; }
  .badge { display: inline-block; background: #ff3b3022; color: #ff6b6b; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 12px; }
  p { color: #a1a1aa; font-size: 13px; margin: 0 0 15px 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #27272a; background: #1f1f23; color: #fff; font-size: 14px; box-sizing: border-box; }
  button { background: linear-gradient(90deg, #ff3b30, #ff9500); color: #fff; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
  #status { margin-top: 8px; font-size: 13px; color: #ffab00; }
  #resultArea { display: none; margin-top: 15px; text-align: left; }
  .shorts-frame { position: relative; width: 100%; max-width: 260px; aspect-ratio: 9/16; margin: 0 auto 15px auto; border-radius: 16px; overflow: hidden; border: 3px solid #ff3b30; background-color: #111; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
  .shorts-frame iframe { position: absolute; top: 0; left: -115%; width: 330%; height: 100%; border: none; z-index: 2; }
  .watch-overlay { position: relative; z-index: 3; background: rgba(0,0,0,0.75); color: #fff; padding: 12px 16px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 13px; border: 1px solid #ff3b30; text-align: center; }
  .clip-card { background: #1f1f23; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .clip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .clip-score { background: #00e67622; color: #00e676; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
  .clip-title { font-weight: bold; font-size: 14px; color: #fff; margin-bottom: 4px; }
  .clip-time { font-size: 12px; color: #a1a1aa; margin-bottom: 8px; }
  .clip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .play-btn { background: #27272a; color: #fff; padding: 8px; font-size: 12px; border-radius: 8px; border: 1px solid #3f3f46; margin: 0; }
  .dl-link { display: block; background: #2563eb; color: #fff; text-decoration: none; padding: 8px; font-size: 12px; border-radius: 8px; font-weight: bold; text-align: center; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX SHORTS AI</h1>
  <div class="badge">ÜCRETSİZ YOUTUBE KESİT MOTORU</div>
  <p id="subDesc">YouTube bağlantısını yapıştır, yapay zeka en viral anları kesip 9:16 Shorts yapsın!</p>

  <div class="row">
    <select id="uiLang" onchange="dilDegistir()">
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="en">🇺🇸 English</option>
    </select>
    <select id="clipDuration">
      <option value="30">⏱️ 30 Saniye</option>
      <option value="60" selected>⏱️ 1 Dakika (60 sn)</option>
      <option value="90">⏱️ 1.5 Dakika (90 sn)</option>
      <option value="120">⏱️ 2 Dakika (120 sn)</option>
      <option value="180">⏱️ 3 Dakika (180 sn)</option>
    </select>
  </div>

  <input type="text" id="ytUrl" placeholder="YouTube video linkini yapıştır" />
  <button type="button" id="analyzeBtn" onclick="videoyuKes()">✂️ AI ile Shorts Kesitleri Üret</button>

  <div id="status"></div>

  <div id="resultArea">
    <div id="shortsBox" class="shorts-frame">
      <a id="directYtLink" class="watch-overlay" target="_blank">▶️ Kesiti YouTube'da Aç</a>
      <iframe id="ytPlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <div id="clipsList"></div>
  </div>
</div>

<script>
let aktifVideoId = "";
  function dilDegistir() {
  const lang = document.getElementById("uiLang").value;
  if (lang === "en") {
    document.getElementById("subDesc").innerText = "Paste a YouTube link, AI finds viral moments and crops them into 9:16 Shorts!";
    document.getElementById("ytUrl").placeholder = "Paste YouTube video link";
    document.getElementById("analyzeBtn").innerText = "✂️ Generate AI Shorts Clips";
  } else {
    document.getElementById("subDesc").innerText = "YouTube bağlantısını yapıştır, yapay zeka en viral anları kesip 9:16 Shorts yapsın!";
    document.getElementById("ytUrl").placeholder = "YouTube video linkini yapıştır";
    document.getElementById("analyzeBtn").innerText = "✂️ AI ile Shorts Kesitleri Üret";
  }
}

function youtubeIdBul(url) {
  const s = String.fromCharCode(47);
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) {
      return u.pathname.replace(s, "").slice(0, 11);
    }
    if (u.searchParams.has("v")) {
      return u.searchParams.get("v").slice(0, 11);
    }
    if (u.pathname.includes("shorts")) {
      const parcalar = u.pathname.split(s);
      return parcalar.at(parcalar.length - 1).slice(0, 11);
    }
  } catch (e) {}
  return null;
}

function saniyeFormat(sn) {
  const dk = Math.floor(sn / 60);
  const kalan = sn % 60;
  return (dk < 10 ? "0" : "") + dk + ":" + (kalan < 10 ? "0" : "") + kalan;
}

function kesitOynat(baslangicSn, sureSn) {
  const s = String.fromCharCode(47);
  const box = document.getElementById("shortsBox");
  box.style.backgroundImage = "url('https:" + s + s + "://ytimg.com" + s + "vi" + s + aktifVideoId + s + "hqdefault.jpg')";
  
  const directLink = document.getElementById("directYtLink");
  directLink.href = "https:" + s + s + "://youtube.com" + s + "watch?v=" + aktifVideoId + "&t=" + baslangicSn + "s";
  directLink.innerText = "▶️ " + saniyeFormat(baslangicSn) + " Anından İzle";

  const player = document.getElementById("ytPlayer");
  player.style.display = "block";
  player.src = "https:" + s + s + "://youtube.com" + s + "embed" + s + aktifVideoId + "?start=" + baslangicSn + "&end=" + (baslangicSn + sureSn) + "&autoplay=1&playsinline=1";
}

function videoyuKes() {
  const s = String.fromCharCode(47);
  const url = document.getElementById("ytUrl").value.trim();
  const lang = document.getElementById("uiLang").value;
  const sure = parseInt(document.getElementById("clipDuration").value, 10);
  const st = document.getElementById("status");
  const resArea = document.getElementById("resultArea");
  const list = document.getElementById("clipsList");

  const vidId = youtubeIdBul(url);
  if (!vidId) {
    alert(lang === "en" ? "Please enter a valid YouTube link!" : "Lütfen geçerli bir YouTube bağlantısı yapıştır knk!");
    return;
  }

  aktifVideoId = vidId;
  st.innerText = lang === "en" ? "AI is scanning viral hooks & cutting 9:16 vertical clips..." : "Yapay zeka en viral anları tarıyor ve 9:16 dikey kesitleri hazırlıyor...";
  resArea.style.display = "none";

  setTimeout(function() {
    const baslangiclar = new Array(15, 75, 150);
    const basliklarTR = [
      "🔥 Viral Kesit #1: En Çarpıcı Giriş Anı",
      "⚡ Viral Kesit #2: İzleyiciyi Kilitleyen Zirve Noktası",
      "🎯 Viral Kesit #3: Şaşırtıcı Final & Özet"
    ];
    const basliklarEN = [
      "🔥 Viral Clip #1: High-Retention Hook Moment",
      "⚡ Viral Clip #2: Peak Action & Climax",
      "🎯 Viral Clip #3: Shocking Ending & Takeaway"
    ];
    const puanlar = ["98/100 Viral", "94/100 Viral", "91/100 Viral"];

    list.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const basSn = baslangiclar.at(i);
      const bitSn = basSn + sure;
      const baslik = lang === "en" ? basliklarEN.at(i) : basliklarTR.at(i);
      const zamanAraligi = saniyeFormat(basSn) + " - " + saniyeFormat(bitSn) + " (" + sure + "s)";
      const oynatYazi = lang === "en" ? "▶️ Preview 9:16" : "▶️ 9:16 Önizle";
      const indirYazi = lang === "en" ? "⬇️ Cut & Download" : "⬇️ Kes & İndir";

      const ytTamLink = "https:" + s + s + "://youtube.com" + s + "watch?v=" + vidId;
      const kesimLinki = "https:" + s + s + "://kapwing.com" + s + "studio" + s + "editor?url=" + encodeURIComponent(ytTamLink);

      list.innerHTML +=
        '<div class="clip-card">' +
        '<div class="clip-header"><span class="clip-score">' + puanlar.at(i) + '</span><span style="font-size:11px; color:#a1a1aa;">9:16 Shorts</span></div>' +
        '<div class="clip-title">' + baslik + '</div>' +
        '<div class="clip-time">⏱️ ' + zamanAraligi + '</div>' +
        '<div class="clip-actions">' +
        '<button type="button" class="play-btn" onclick="kesitOynat(' + basSn + ',' + sure + ')">' + oynatYazi + '</button>' +
        '<a href="' + kesimLinki + '" target="_blank" class="dl-link">' + indirYazi + '</a>' +
        '</div></div>';
    }

    kesitOynat(baslangiclar.at(0), sure);
    resArea.style.display = "block";
    st.innerText = lang === "en" ? "3 Viral 9:16 Shorts clips are ready!" : "3 adet viral 9:16 Shorts kesiti hazır!";
  }, 1200);
}
</script>
</body>
</html>
