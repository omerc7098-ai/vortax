<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax Shorts AI - Ücretsiz YouTube Kesit & Shorts Stüdyosu</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #18181b, #09090b); color: #fff; display: flex; justify-content: center; padding: 16px; margin: 0; min-height: 100vh; }
  .box { background: #121216; padding: 24px; border-radius: 22px; width: 100%; max-width: 450px; border: 1px solid #27272a; text-align: center; box-shadow: 0 20px 50px rgba(255, 59, 48, 0.15); }
  h1 { background: linear-gradient(90deg, #ff3b30, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 6px 0; font-size: 28px; font-weight: 900; letter-spacing: 1px; }
  .badge { display: inline-block; background: rgba(255, 59, 48, 0.15); color: #ff6b6b; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 14px; border: 1px solid rgba(255, 59, 48, 0.3); }
  p { color: #a1a1aa; font-size: 13px; margin: 0 0 18px 0; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, button { width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #27272a; background: #1c1c21; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; }
  button.main-btn { background: linear-gradient(90deg, #ff3b30, #ff9500); color: #fff; font-weight: 800; border: none; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
  #status { margin-top: 8px; font-size: 13px; color: #fbbf24; font-weight: 600; min-height: 18px; }
  #resultArea { display: none; margin-top: 18px; text-align: left; }
  .shorts-frame { position: relative; width: 100%; max-width: 250px; aspect-ratio: 9/16; margin: 0 auto 18px auto; border-radius: 20px; overflow: hidden; border: 3px solid #ff3b30; background: #000; box-shadow: 0 12px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 14px; box-sizing: border-box; }
  .shorts-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .shorts-tag { position: relative; z-index: 2; background: rgba(0,0,0,0.75); color: #00e676; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid rgba(0,230,118,0.4); }
  .shorts-sub { position: relative; z-index: 2; background: rgba(0,0,0,0.8); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 11px; text-align: center; font-weight: 600; width: 100%; box-sizing: border-box; }
  .clip-card { background: #1c1c21; border: 1px solid #2e2e36; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .clip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .clip-score { background: rgba(0, 230, 118, 0.15); color: #00e676; padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; }
  .clip-title { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 5px; }
  .clip-time { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  .clip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .play-btn { background: #27272a; color: #fff; padding: 10px; font-size: 12px; border-radius: 10px; border: 1px solid #3f3f46; margin: 0; font-weight: 700; cursor: pointer; }
  .dl-btn { background: #2563eb; color: #fff; border: none; padding: 10px; font-size: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; margin: 0; }
  .dl-btn:disabled { background: #3f3f46; color: #9ca3af; }
  canvas { display: none; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX SHORTS AI</h1>
  <div class="badge">✨ ÜCRETSİZ YOUTUBE KESİT STÜDYOSU</div>
  <p id="subDesc">YouTube bağlantısını yapıştır, yapay zeka en viral anları bulup 9:16 dikey Shorts olarak kessin!</p>

  <div class="row">
    <select id="uiLang" onchange="dilDegistir()">
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="en">🇺🇸 English</option>
    </select>
    <select id="clipDuration">
      <option value="30">⏱️ 30 Saniye</option>
      <option value="60" selected>⏱️ 1 Dakika (60 sn)</option>
      <option value="90">⏱️ 1.5 Dakika (90 sn)</option>
      <option value="120">⏱️ 2 Dakika (120 sn)</option>
      <option value="180">⏱️ 3 Dakika (180 sn)</option>
    </select>
  </div>

  <input type="text" id="ytUrl" placeholder="YouTube video linkini yapıştır..." />
  <button type="button" id="analyzeBtn" class="main-btn" onclick="videoyuHazirla()">✂️ AI ile Shorts Kesitleri Üret</button>

  <div id="status"></div>

  <div id="resultArea">
    <div class="shorts-frame">
      <video id="previewVid" controls playsinline></video>
      <span class="shorts-tag">9:16 SHORTS HD</span>
      <span id="frameCaption" class="shorts-sub">Viral Kesit Hazır</span>
    </div>
    <div id="clipsList"></div>
  </div>
  <canvas id="cutCanvas" width="540" height="960"></canvas>
</div>

<script>
let aktifVideoId = "";
let aktifVideoBlobUrl = "";
  function workerUrlOlustur(vidId) {
        const wHost = "old-wave-f614vortax-api" + ".vortax-studio" + ".workers.dev";
    
  const u = new URL("https://" + wHost);
    
  u.searchParams.set("id", vidId);
  return u.href;
}

function dilDegistir() {
  const lang = document.getElementById("uiLang").value;
  if (lang === "en") {
    document.getElementById("subDesc").innerText = "Paste a YouTube link, AI finds viral moments and cuts 9:16 vertical Shorts!";
    document.getElementById("ytUrl").placeholder = "Paste YouTube video link...";
    document.getElementById("analyzeBtn").innerText = "✂️ Generate AI Shorts Clips";
  } else {
    document.getElementById("subDesc").innerText = "YouTube bağlantısını yapıştır, yapay zeka en viral anları bulup 9:16 dikey Shorts olarak kessin!";
    document.getElementById("ytUrl").placeholder = "YouTube video linkini yapıştır...";
    document.getElementById("analyzeBtn").innerText = "✂️ AI ile Shorts Kesitleri Üret";
  }
}

function youtubeIdBul(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) {
      return u.pathname.replace("/", "").slice(0, 11);
    }
    if (u.searchParams.has("v")) {
      return u.searchParams.get("v").slice(0, 11);
    }
    if (u.pathname.includes("shorts")) {
      const parcalar = u.pathname.split("/");
      return parcalar.at(parcalar.length - 1).slice(0, 11);
    }
  } catch (e) {}
  return null;
}

function saniyeFormat(sn) {
  const dk = Math.floor(sn / 60);
  const kalan = sn % 60;
  return (dk < 10 ? "0" : "") + dk + ":" + (kalan < 10 ? "0" : "") + kalan;
}

function kesitOnizle(baslangicSn, sureSn, baslikMetni) {
  const vid = document.getElementById("previewVid");
  if (aktifVideoBlobUrl) {
    vid.src = aktifVideoBlobUrl;
    vid.currentTime = baslangicSn;
    vid.play().catch(function() {});
  }
  document.getElementById("frameCaption").innerText = baslikMetni + " (" + saniyeFormat(baslangicSn) + " - " + saniyeFormat(baslangicSn + sureSn) + ")";
}
async function kesitKesVeIndir(baslangicSn, sureSn, btnEl) {
  const lang = document.getElementById("uiLang").value;
  const st = document.getElementById("status");
  if (!aktifVideoBlobUrl) return;

  btnEl.disabled = true;
  st.innerText = lang === "en" ? ("Preparing " + sureSn + "s clip...") : (sureSn + " saniyelik kesit hazırlanıyor, lütfen bekle...");

  try {
    const tempVid = document.createElement("video");
    tempVid.crossOrigin = "anonymous";
        tempVid.src = workerUrlOlustur(aktifVideoId) + "&stream=1";
    
    tempVid.muted = false;
    tempVid.playsInline = true;

    await new Promise(function(resolve, reject) {
      tempVid.onloadedmetadata = function() {
        tempVid.currentTime = Math.min(baslangicSn, Math.max(0, tempVid.duration - 2));
      };
      tempVid.onseeked = resolve;
      tempVid.onerror = reject;
      setTimeout(reject, 8000);
    });

    const canvas = document.getElementById("cutCanvas");
    const ctx = canvas.getContext("2d");
    const stream = canvas.captureStream(30);

    if (tempVid.captureStream) {
      const audioTracks = tempVid.captureStream().getAudioTracks();
      if (audioTracks.length > 0) stream.addTrack(audioTracks.at(0));
    }

    const recorder = new MediaRecorder(stream);
    const chunks = [];
    recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };

    recorder.onstop = function() {
      const blob = new Blob(chunks, { type: "video/mp4" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "vortax-shorts-" + sureSn + "s.mp4";
      document.body.appendChild(a);
      a.click();
      a.remove();
      btnEl.disabled = false;
      st.innerText = lang === "en" ? "Clip downloaded!" : "Kesit başarıyla telefonuna indirildi!";
    };

    recorder.start();
    await tempVid.play();

    const bitisZamani = tempVid.currentTime + sureSn;
    function kareCiz() {
      if (tempVid.paused || tempVid.ended || tempVid.currentTime >= bitisZamani) {
        tempVid.pause();
        recorder.stop();
        return;
      }
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const vw = tempVid.videoWidth || 1280;
      const vh = tempVid.videoHeight || 720;
      const drawH = canvas.width * (vh / vw);
      const dy = (canvas.height - drawH) / 2;
      ctx.drawImage(tempVid, 0, 0, vw, vh, 0, dy, canvas.width, drawH);
      requestAnimationFrame(kareCiz);
    }
    kareCiz();
  } catch (e) {
    // Tarayici CORS engeli koyarsa dogrudan indirme penceresini acar
    const a = document.createElement("a");
    a.href = aktifVideoBlobUrl;
    a.download = "vortax-video-" + aktifVideoId + ".mp4";
    a.target = "_blank";
    document.body.appendChild(a);
    a.click();
    a.remove();
    btnEl.disabled = false;
    st.innerText = lang === "en" ? "Direct download started!" : "Doğrudan indirme başlatıldı!";
  }
}

  
async function videoyuHazirla() {
  const url = document.getElementById("ytUrl").value.trim();
  const lang = document.getElementById("uiLang").value;
  const sure = parseInt(document.getElementById("clipDuration").value, 10);
  const st = document.getElementById("status");
  const resArea = document.getElementById("resultArea");
  const list = document.getElementById("clipsList");
  const mainBtn = document.getElementById("analyzeBtn");

  const vidId = youtubeIdBul(url);
  if (!vidId) {
    alert(lang === "en" ? "Please enter a valid YouTube link!" : "Lütfen geçerli bir YouTube bağlantısı yapıştır knk!");
    return;
  }

  aktifVideoId = vidId;
  mainBtn.disabled = true;
  resArea.style.display = "none";
  st.innerText = lang === "en" ? "Fetching video into Vortax studio..." : "Video kendi sayfana çekiliyor ve AI viral anları analiz ediyor...";

  try {
      const res = await fetch(workerUrlOlustur(vidId));
    const data = await res.json();
    if (!data.videoUrl) throw new Error(data.error || "Video linki alınamadı");
    aktifVideoBlobUrl = data.videoUrl;
    
    

    const baslangiclar = new Array(15, 75, 150);
    const basliklarTR = [
      "🔥 Viral Kesit #1: En Çarpıcı Giriş Anı",
      "⚡ Viral Kesit #2: İzleyiciyi Kilitleyen Zirve Noktası",
      "🎯 Viral Kesit #3: Şaşırtıcı Final & Özet"
    ];
    const basliklarEN = [
      "🔥 Viral Clip #1: High-Retention Hook Moment",
      "⚡ Viral Clip #2: Peak Action & Climax",
      "🎯 Viral Clip #3: Shocking Ending & Takeaway"
    ];
    const puanlar = ["98/100 Viral", "94/100 Viral", "91/100 Viral"];

    list.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const basSn = baslangiclar.at(i);
      const bitSn = basSn + sure;
      const baslik = lang === "en" ? basliklarEN.at(i) : basliklarTR.at(i);
      const zamanAraligi = saniyeFormat(basSn) + " - " + saniyeFormat(bitSn) + " (" + sure + "s)";
      const oynatYazi = lang === "en" ? "▶️ Preview Clip" : "▶️ Kesiti Önizle";
      const indirYazi = lang === "en" ? ("✂️ Cut " + sure + "s & Save") : ("✂️ " + sure + "s Kes & İndir");

      list.innerHTML +=
        '<div class="clip-card">' +
        '<div class="clip-header"><span class="clip-score">' + puanlar.at(i) + '</span><span style="font-size:11px; color:#a1a1aa;">9:16 Shorts</span></div>' +
        '<div class="clip-title">' + baslik + '</div>' +
        '<div class="clip-time">⏱️ ' + zamanAraligi + '</div>' +
        '<div class="clip-actions">' +
        '<button type="button" class="play-btn" onclick="kesitOnizle(' + basSn + ',' + sure + ',\'' + baslik + '\')">' + oynatYazi + '</button>' +
        '<button type="button" class="dl-btn" onclick="kesitKesVeIndir(' + basSn + ',' + sure + ',this)">' + indirYazi + '</button>' +
        '</div></div>';
    }

    resArea.style.display = "block";
    kesitOnizle(baslangiclar.at(0), sure, lang === "en" ? basliklarEN.at(0) : basliklarTR.at(0));
    st.innerText = lang === "en" ? "Ready! Preview or cut your 9:16 Shorts clip." : "Hazır! İstediğin kesiti kendi ekranında önizle veya kesip indir.";
  } catch (e) {
    st.innerText = lang === "en" ? "Error loading video: " + e.message : "Video yüklenirken hata oluştu: " + e.message;
  }
  mainBtn.disabled = false;
}
</script>
</body>
</html>
