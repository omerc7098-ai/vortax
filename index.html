<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortax AI - Ücretsiz Video Üretici</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d0d0d; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #1a1a1a; padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0, 230, 118, 0.15); border: 1px solid #2a2a2a; text-align: center; }
        h1 { font-size: 26px; margin-bottom: 5px; color: #00e676; letter-spacing: 1px; }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 20px; }
        select, textarea, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background-color: #262626; color: white; font-size: 16px; box-sizing: border-box; }
        button { background-color: #00e676; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00c853; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #ffab00; line-height: 1.4; }
        video { width: 100%; border-radius: 10px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>VORTAX AI</h1>
    <p>İstediğin dilde yaz, Vortax yapay zekası videoya dönüştürsün.</p>
    
    <select id="language">
        <option value="Türkçe">Türkçe</option>
        <option value="English">English</option>
        <option value="Español">Español</option>
        <option value="Deutsch">Deutsch</option>
        <option value="Français">Français</option>
        <option value="العربية">العربية</option>
        <option value="Русский">Русский</option>
        <option value="Diğer (Otomatik Algıla)">Diğer Tüm Diller (Otomatik)</option>
    </select>

    <textarea id="prompt" rows="4" placeholder="Örn: Uzayda kaykay yapan bir kedi, sinematik ışıklandırma..."></textarea>
    
    <button id="generateBtn" onclick="generateVideo()">Vortax ile Video Oluştur</button>
    
    <div id="status"></div>
    <video id="outputVideo" controls autoplay loop playsinline></video>
</div>

<script>
    // GEMINI API ANAHTARINI TIRNAKLARIN İÇİNE YAPIŞTIR
    const GEMINI_API_KEY = "AQ.Ab8RN6KHL7IMnLv61W_C4PtRqF5PcBZV_23dP9-Ic1IlbxeuRQ"; 

    async function translateToEnglish(text) {
        const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `Translate the following video prompt into detailed English for an AI video generator. Return ONLY the English translation, nothing else: "${text}"` }] }]
            })
        });
        
        if (!response.ok) {
            const errData = await response.json();
            throw new Error("Çeviri hatası: " + (errData.error?.message || "Gemini anahtarını kontrol et."));
        }
        
        const data = await response.json();
        return data.candidates.content.parts.text.trim();
    }

    async function generateVideo() {
        const promptText = document.getElementById("prompt").value.trim();
        const statusDiv = document.getElementById("status");
        const videoElement = document.getElementById("outputVideo");
        const btn = document.getElementById("generateBtn");

        if (!promptText) {
            alert("Lütfen bir metin yazın!");
            return;
        }

        if (!GEMINI_API_KEY) {
            statusDiv.innerText = "Hata: Kodun içine Gemini API anahtarını yapıştırmamışsın!";
            return;
        }

        btn.disabled = true;
        videoElement.style.display = "none";
        statusDiv.innerText = "1/3: Vortax metni yapay zeka için çeviriyor...";

        try {
            const englishPrompt = await translateToEnglish(promptText);
            statusDiv.innerText = "2/3: Çeviri tamam (" + englishPrompt + "). Ücretsiz video sunucusuna istek gönderiliyor...";

            // Doğrudan Gradio REST API kuyruğuna istek at (Dış kütüphanesiz, %100 tarayıcı uyumlu)
            const callResponse = await fetch("https://hf.space", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    data: [englishPrompt, "1280*720", false, -1]
                })
            });

            if (!callResponse.ok) {
                throw new Error("Video sunucusu şu an dolu (" + callResponse.status + "). Biraz bekleyip tekrar dene.");
            }

            const callData = await callResponse.json();
            const eventId = callData.event_id;

            statusDiv.innerText = "3/3: Vortax videoyu işliyor (Ücretsiz sunucu yoğunluğuna göre 1-2 dakika sürebilir, lütfen sayfadan çıkma)...";

            // Sonucu stream üzerinden bekle
            const resultResponse = await fetch(`https://hf.space/${eventId}`);
            const resultText = await resultResponse.text();

            // Gelen yanıttan video URL'sini ayıkla
            const urlMatch = resultText.match(/"url":\s*"([^"]+\.mp4[^"]*)"/);
            
            if (urlMatch && urlMatch) {
                videoElement.src = urlMatch;
                videoElement.style.display = "block";
                statusDiv.innerText = "Video hazır! Sağ alttaki üç noktadan indirebilirsin.";
            } else {
                throw new Error("Ücretsiz sunucu yoğunluk nedeniyle sırayı iptal etti. 1 dakika sonra tekrar dene.");
            }

        } catch (error) {
            statusDiv.innerText = "Durum: " + error.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
