<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax AI - Gerçekçi POV Video Stüdyosu</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #09090b; color: #fff; display: flex; justify-content: center; padding: 15px; margin: 0; }
  .box { background: #141418; padding: 20px; border-radius: 18px; width: 100%; max-width: 440px; border: 1px solid #27272a; text-align: center; box-shadow: 0 10px 30px rgba(0,230,118,0.12); }
  h1 { color: #00e676; margin: 0 0 4px 0; font-size: 24px; letter-spacing: 1px; }
  .badge { display: inline-block; background: #ef444422; color: #f87171; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 12px; }
  p { color: #a1a1aa; font-size: 13px; margin: 0 0 15px 0; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #27272a; background: #1f1f23; color: #fff; font-size: 14px; box-sizing: border-box; }
  button { background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
  button:disabled { background: #3f3f46; color: #888; }
  .voice-btn { background: #ff9100; color: #000; display: none; margin-top: 8px; }
  .dl-btn { display: none; background: #2979ff; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 8px; font-size: 14px; }
  #status { margin-top: 10px; font-size: 13px; color: #ffab00; }
  video { width: 100%; max-width: 270px; aspect-ratio: 9/16; border-radius: 14px; margin: 15px auto 0 auto; display: none; border: 2px solid #27272a; background: #000; }
  canvas { display: none; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX AI STUDIO</h1>
  <div class="badge">AI SENARYO • ÇİZİM • TOK SES MOTORU</div>
  <p>Aklındaki herhangi bir konuyu yaz; yapay zeka 3 sahnelik çizim ve sesli video üretsin!</p>

  <input type="text" id="topic" placeholder="Örn: 30 gün zombi istilası veya köpek virüsü..." />
  <button id="btn" type="button" onclick="uretimeBasla()">🎬 AI ile Viral Video Üret</button>

  <div id="status"></div>
  <canvas id="cvs" width="540" height="960"></canvas>
  <video id="vid" controls autoplay loop playsinline></video>
  <button id="speakBtn" type="button" class="voice-btn" onclick="sesOku()">🔊 Hikaye Sesini Tekrar Dinle</button>
  <a id="dl" class="dl-btn" download="vortax-ai-video.webm">⬇️ TikTok / Reels Videosunu İndir</a>
</div>

<script>
const API_URL = "https://workers.dev";
let tamMetin = "";
let sesler = [];

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function() { sesler = window.speechSynthesis.getVoices(); };
}

function sesOku() {
  if (!tamMetin || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  if (sesler.length === 0) sesler = window.speechSynthesis.getVoices();
  const u = new SpeechSynthesisUtterance(tamMetin);
  u.lang = "tr-TR";
  const tr = sesler.filter(function(v) { return v.lang.toLowerCase().includes("tr"); });
  if (tr.length > 0) {
    const iyi = tr.find(function(v) { return v.name.toLowerCase().includes("google") || v.name.toLowerCase().includes("natural"); });
    u.voice = iyi || tr.at(0);
  }
  u.rate = 0.94;
  u.pitch = 0.80;
  window.speechSynthesis.speak(u);
}

function resimYukle(komut) {
  return new Promise(function(resolve) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    const timeout = setTimeout(function() { resolve(null); }, 15000);
    img.onload = function() { clearTimeout(timeout); resolve(img); };
    img.onerror = function() { clearTimeout(timeout); resolve(null); };
    img.src = API_URL + "/img?p=" + encodeURIComponent(komut);
  });
}
  function videoBirlesikRender(baslik, sahneler) {
  return new Promise(function(resolve) {
    const c = document.getElementById("cvs");
    const ctx = c.getContext("2d");
    const stream = c.captureStream(30);
    const rec = new MediaRecorder(stream);
    const chunks = [];

    rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = function() {
      const b = new Blob(chunks, { type: "video/webm" });
      resolve(URL.createObjectURL(b));
    };

    rec.start();
    let frame = 0;
    const toplamKare = 270;

    function ciz() {
      if (frame >= toplamKare) { rec.stop(); return; }

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 28px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(baslik, c.width / 2, 165, 460);

      const sahneIdx = Math.min(2, Math.floor(frame / 90));
      const aktifSahne = sahneler.at(sahneIdx);
      const lokalFrame = frame % 90;

      ctx.save();
      ctx.beginPath();
      ctx.rect(40, 240, 460, 440);
      ctx.clip();

      if (aktifSahne.img) {
        const zoom = 1.0 + (lokalFrame / 90) * 0.14;
        const w = 460 * zoom;
        const h = 440 * zoom;
        ctx.drawImage(aktifSahne.img, 40 - (w - 460) / 2, 240 - (h - 440) / 2, w, h);
      } else {
        ctx.fillStyle = "#1f2937";
        ctx.fillRect(40, 240, 460, 440);
      }
      ctx.restore();

      const kelimeler = aktifSahne.text.toUpperCase().split(" ");
      const kIdx = Math.floor((lokalFrame / 90) * kelimeler.length);
      const altYazi = kelimeler.slice(Math.max(0, kIdx - 1), kIdx + 2).join(" ");

      ctx.font = "900 30px Arial, sans-serif";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 7;
      ctx.strokeText(altYazi, c.width / 2, 645);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(altYazi, c.width / 2, 645);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 21px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Yeni partlar ve seriler için", c.width / 2, 775);
      ctx.fillText("takip etmeyi görüşlerinizi", c.width / 2, 805);
      ctx.fillText("yorumlara yazmayı unutmayın", c.width / 2, 835);

      frame++;
      requestAnimationFrame(ciz);
    }
    ciz();
  });
}

async function uretimeBasla() {
  const konu = document.getElementById("topic").value.trim();
  if (!konu) { alert("Lütfen bir konu yaz knk!"); return; }

  const st = document.getElementById("status");
  const vidEl = document.getElementById("vid");
  const spBtn = document.getElementById("speakBtn");
  const dl = document.getElementById("dl");
  const btn = document.getElementById("btn");

  btn.disabled = true;
  vidEl.style.display = "none";
  spBtn.style.display = "none";
  dl.style.display = "none";

  try {
    st.innerText = "1/3: Gemini AI senaryoyu yazıyor...";
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: konu })
    });
    const senaryo = await res.json();
    if (senaryo.error) throw new Error(senaryo.error);

    st.innerText = "2/3: Yapay zeka 3 farklı sahne çizimini üretiyor (15-20 sn)...";
    const img1 = await resimYukle(senaryo.s1_img);
    const img2 = await resimYukle(senaryo.s2_img);
    const img3 = await resimYukle(senaryo.s3_img);

    st.innerText = "3/3: Sahneler, alt yazılar ve ses birleştiriliyor...";
    tamMetin = senaryo.title + ". " + senaryo.s1_text + " " + senaryo.s2_text + " " + senaryo.s3_text;

    const vUrl = await videoBirlesikRender(senaryo.title, [
      { text: senaryo.s1_text, img: img1 },
      { text: senaryo.s2_text, img: img2 },
      { text: senaryo.s3_text, img: img3 }
    ]);

    vidEl.src = vUrl;
    vidEl.style.display = "block";
    spBtn.style.display = "block";
    dl.href = vUrl;
    dl.style.display = "block";
    st.innerText = "AI Videon hazır! Oynatabilir, sesini dinleyebilir veya indirebilirsin.";
    sesOku();
  } catch (e) {
    st.innerText = "Durum: " + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
