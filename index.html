<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax AI Studio</title>
<style>
  body { font-family: sans-serif; background: #0d0d0d; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
  .box { background: #1a1a1a; padding: 22px; border-radius: 15px; width: 100%; max-width: 480px; border: 1px solid #2a2a2a; text-align: center; }
  h1 { color: #00e676; margin: 0 0 5px 0; font-size: 24px; }
  p { color: #aaa; font-size: 13px; margin: 0 0 15px 0; }
  select, textarea, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #262626; color: #fff; font-size: 15px; box-sizing: border-box; }
  button { background: #00e676; color: #000; font-weight: bold; border: none; cursor: pointer; }
  button:disabled { background: #555; }
  .voice-btn { background: #ff9100; color: #000; display: none; }
  .dl-btn { display: none; background: #2979ff; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 8px; }
  #status { margin-top: 10px; font-size: 14px; color: #ffab00; }
  video { width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #333; }
  #scriptBox { display: none; background: #222; padding: 12px; border-radius: 8px; margin-top: 12px; text-align: left; font-size: 13px; border-left: 3px solid #00e676; }
  canvas { display: none; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX AI STUDIO</h1>
  <p>Sinematik Video & Çok Dilli Seslendirme Motoru</p>

  <select id="theme">
    <option value="cyber">🌃 Siberpunk & Neon Atmosfer</option>
    <option value="space">🌌 Uzay & Galaksi Teması</option>
    <option value="nature">🌲 Doğa & Gün Batımı Teması</option>
    <option value="matrix">💻 Dijital Matrix & Veri Akışı</option>
  </select>

  <select id="lang">
    <option value="tr-TR">🇹🇷 Türkçe</option>
    <option value="en-US">🇺🇸 English</option>
    <option value="es-ES">🇪🇸 Español</option>
    <option value="de-DE">🇩🇪 Deutsch</option>
    <option value="fr-FR">🇫🇷 Français</option>
    <option value="ar-SA">🇸🇦 العربية</option>
    <option value="ru-RU">🇷🇺 Русский</option>
  </select>

  <textarea id="prompt" rows="3" placeholder="Videoda anlatılacak ve ekranda işlenecek sahneyi yaz..."></textarea>
  <button id="btn" type="button" onclick="olustur()">Vortax ile Video & Ses Oluştur</button>

  <div id="status"></div>
  <canvas id="cvs" width="640" height="640"></canvas>
  <video id="vid" controls autoplay loop playsinline></video>
  <div id="scriptBox"></div>
  <button id="speakBtn" type="button" class="voice-btn" onclick="seslendir()">🔊 Seslendirmeyi Tekrar Dinle</button>
  <a id="dl" class="dl-btn" download="vortax-video.webm">⬇️ Videoyu Cihaza İndir</a>
</div>

<script>
let aktifMetin = "";

function seslendir() {
  if (!aktifMetin || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(aktifMetin);
  u.lang = document.getElementById("lang").value;
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function temaRenkleri(tema) {
  if (tema === "space") return ["#050114", "#1a0638", "#00d4ff"];
  if (tema === "nature") return ["#1c0f0a", "#4a1c11", "#ff9e00"];
  if (tema === "matrix") return ["#000a00", "#002605", "#00ff41"];
  return ["#0a0514", "#1f0836", "#00e676"];
}

function sahneVideoyaCevir(metin, tema) {
  return new Promise(function(resolve) {
    const c = document.getElementById("cvs");
    const ctx = c.getContext("2d");
    const renkler = temaRenkleri(tema);
    const stream = c.captureStream(30);
    const rec = new MediaRecorder(stream);
    const chunks = [];

    rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = function() {
      const b = new Blob(chunks, { type: "video/webm" });
      resolve(URL.createObjectURL(b));
    };

    // Hareketli ışık parçacıkları oluştur
    const parcaciklar = [];
    for (let i = 0; i < 45; i++) {
      parcaciklar.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 4 + 1.5,
        vx: (Math.random() - 0.5) * 2.5,
        vy: (Math.random() - 0.5) * 2.5
      });
    }

    rec.start();
    let frame = 0;
    const toplamKare = 150; // 5 saniyelik akıcı 30 FPS video

    function kareCiz() {
      if (frame >= toplamKare) {
        rec.stop();
        return;
      }

      // 1. Dinamik arka plan gradyanı
      const grad = ctx.createRadialGradient(c.width/2, c.height/2, 40 + frame, c.width/2, c.height/2, 450);
      grad.addColorStop(0, renkler.item ? renkler.item(1) : renkler.at(1));
      grad.addColorStop(1, renkler.at(0));
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, c.width, c.height);

      // 2. Hareketli parçacıklar
      ctx.fillStyle = renkler.at(2);
      for (let i = 0; i < parcaciklar.length; i++) {
        const p = parcaciklar.at(i);
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > c.width) p.vx *= -1;
        if (p.y < 0 || p.y > c.height) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. Sinematik kamera çerçevesi ve VORTAX AI filigranı
      ctx.strokeStyle = renkler.at(2);
      ctx.lineWidth = 3;
      ctx.strokeRect(25, 25, c.width - 50, c.height - 50);

      ctx.fillStyle = renkler.at(2);
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("VORTAX AI STUDIO", c.width / 2, 65);

      // 4. Kullanıcının yazdığı sahne metnini sinematik alt yazı olarak yerleştir
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 24px sans-serif";
      const kelimeler = metin.split(" ");
      let satir = "";
      let y = c.height / 2 - 20;

      for (let n = 0; n < kelimeler.length; n++) {
        const testSatir = satir + kelimeler.at(n) + " ";
        if (ctx.measureText(testSatir).width > 500 && n > 0) {
          ctx.fillText(satir, c.width / 2, y);
          satir = kelimeler.at(n) + " ";
          y += 34;
        } else {
          satir = testSatir;
        }
      }
      ctx.fillText(satir, c.width / 2, y);

      frame++;
      requestAnimationFrame(kareCiz);
    }

    kareCiz();
  });
}

async function olustur() {
  const txt = document.getElementById("prompt").value.trim();
  const tema = document.getElementById("theme").value;
  const st = document.getElementById("status");
  const vidEl = document.getElementById("vid");
  const sb = document.getElementById("scriptBox");
  const spBtn = document.getElementById("speakBtn");
  const dl = document.getElementById("dl");
  const btn = document.getElementById("btn");

  if (!txt) { alert("Lütfen bir metin yaz knk!"); return; }

  btn.disabled = true;
  vidEl.style.display = "none";
  sb.style.display = "none";
  spBtn.style.display = "none";
  dl.style.display = "none";
  aktifMetin = txt;

  st.innerText = "Vortax AI videoyu ve seslendirmeyi oluşturuyor (5 saniye)...";

  try {
    const videoUrl = await sahneVideoyaCevir(txt, tema);
    vidEl.src = videoUrl;
    vidEl.style.display = "block";
    sb.innerText = "🎙️ Seslendirilen Metin: " + aktifMetin;
    sb.style.display = "block";
    spBtn.style.display = "block";
    dl.href = videoUrl;
    dl.style.display = "block";
    st.innerText = "Video ve seslendirme hazır! İndirebilir veya tekrar dinleyebilirsin.";
    seslendir();
  } catch (e) {
    st.innerText = "Hata: " + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
