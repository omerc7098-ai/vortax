<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax AI - Sınırsız POV Animasyon Stüdyosu</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #09090b; color: #fff; display: flex; justify-content: center; padding: 15px; margin: 0; }
  .box { background: #141418; padding: 20px; border-radius: 18px; width: 100%; max-width: 440px; border: 1px solid #27272a; text-align: center; box-shadow: 0 10px 30px rgba(0,230,118,0.12); }
  h1 { color: #00e676; margin: 0 0 4px 0; font-size: 24px; letter-spacing: 1px; }
  .badge { display: inline-block; background: #00e67622; color: #00e676; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 12px; }
  p { color: #a1a1aa; font-size: 13px; margin: 0 0 15px 0; }
  input, select, textarea, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #27272a; background: #1f1f23; color: #fff; font-size: 14px; box-sizing: border-box; }
  button { background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
  button:disabled { background: #3f3f46; color: #888; }
  .voice-btn { background: #ff9100; color: #000; display: none; margin-top: 8px; }
  .dl-btn { display: none; background: #2979ff; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 8px; font-size: 14px; }
  #status { margin-top: 10px; font-size: 13px; color: #ffab00; }
  video { width: 100%; max-width: 270px; aspect-ratio: 9/16; border-radius: 14px; margin: 15px auto 0 auto; display: none; border: 2px solid #27272a; background: #000; }
  canvas { display: none; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX AI STUDIO</h1>
  <div class="badge">SINIRSIZ ÇÖP ADAM POV & SES MOTORU</div>
  <p>İstediğin başlığı ve sahneyi yaz; çöp adam her harekete bürünsün!</p>

  <input type="text" id="videoTitle" placeholder="Başlık yaz: Örn: Okulda sınavdasın (Part 1)" />

  <select id="voiceGender">
    <option value="male">🎙️ Doğal Erkek Sesi (Akıcı)</option>
    <option value="female">🎙️ Doğal Kadın Sesi (Akıcı)</option>
  </select>

  <textarea id="storyText" rows="3" placeholder="Sahneyi anlat: Örn: Sınav kağıdına bakıyorsun ama hiçbir soruyu bilmediğin için terleyip panik yapıyorsun..."></textarea>

  <button id="btn" type="button" onclick="povOlustur()">🎬 Sınırsız POV Videosu Oluştur</button>

  <div id="status"></div>
  <canvas id="cvs" width="540" height="960"></canvas>
  <video id="vid" controls autoplay loop playsinline></video>
  <button id="speakBtn" type="button" class="voice-btn" onclick="dogalSesOku()">🔊 Doğal Sesi Tekrar Dinle</button>
  <a id="dl" class="dl-btn" download="vortax-pov-video.webm">⬇️ TikTok / Reels Videosunu İndir</a>
</div>

<script>
let okunacakMetin = "";
let yukluSesler = [];

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function() {
    yukluSesler = window.speechSynthesis.getVoices();
  };
}

function dogalSesOku() {
  if (!okunacakMetin || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  if (yukluSesler.length === 0) yukluSesler = window.speechSynthesis.getVoices();

  const cinsiyet = document.getElementById("voiceGender").value;
  const u = new SpeechSynthesisUtterance(okunacakMetin);
  u.lang = "tr-TR";

  const trSesler = yukluSesler.filter(function(v) { return v.lang.toLowerCase().includes("tr"); });
  if (trSesler.length > 0) {
    const dogalSes = trSesler.find(function(v) {
      return v.name.toLowerCase().includes("natural") || v.name.toLowerCase().includes("google") || v.name.toLowerCase().includes("emel") || v.name.toLowerCase().includes("ahmet");
    });
    u.voice = dogalSes || trSesler.at(0);
  }

  u.rate = 0.97;
  u.pitch = cinsiyet === "male" ? 0.85 : 1.08;
  window.speechSynthesis.speak(u);
}

function sahneAnalizEt(tamMetin) {
  const m = tamMetin.toLowerCase();
  if (m.includes("okul") || m.includes("sınav") || m.includes("ders") || m.includes("hoca") || m.includes("sınıf") || m.includes("yaz")) return "exam";
  if (m.includes("kas") || m.includes("poz") || m.includes("spor") || m.includes("vücut") || m.includes("güç")) return "flex";
  if (m.includes("yürü") || m.includes("koş") || m.includes("sokak") || m.includes("kaç") || m.includes("git")) return "walk";
  if (m.includes("ağla") || m.includes("üzül") || m.includes("panik") || m.includes("kork") || m.includes("stres")) return "panic";
  if (m.includes("sevin") || m.includes("dans") || m.includes("zıpla") || m.includes("mutlu") || m.includes("kazan")) return "jump";
  if (m.includes("uyu") || m.includes("yat") || m.includes("yorgun") || m.includes("sabah")) return "sleep";
  return "dynamic";
}

function copAdamSahneCiz(ctx, frame, mod) {
  const dalga = Math.sin(frame * 0.2);
  const hizliDalga = Math.sin(frame * 0.45);
  let cx = 270;
  let cy = 475;

  // 1. ORTAM ÇİZİMİ (Yazılan konuya göre otomatik değişir)
  if (mod === "exam") {
    // Sınıf ortamı ve yazı tahtası
    ctx.fillStyle = "#f1f5f9";
    ctx.fillRect(40, 260, 460, 420);
    ctx.fillStyle = "#14532d";
    ctx.fillRect(80, 285, 380, 120);
    ctx.strokeStyle = "#78350f";
    ctx.lineWidth = 6;
    ctx.strokeRect(80, 285, 380, 120);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("SINAV BAŞLADI!", 270, 350);
  } else if (mod === "walk") {
    // Sokak ve hareket eden arka plan
    ctx.fillStyle = "#bae6fd";
    ctx.fillRect(40, 260, 460, 290);
    ctx.fillStyle = "#475569";
    ctx.fillRect(40, 550, 460, 130);
    const kayma = (frame * 6) % 460;
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(460 - kayma, 350, 65, 200);
  } else {
    // Genel oda/sahne
    ctx.fillStyle = "#e8dfd5";
    ctx.fillRect(40, 260, 460, 420);
    ctx.fillStyle = "#d6c7b2";
    ctx.fillRect(40, 610, 460, 70);
  }

  // Zıplama veya yürüme hareketi
  if (mod === "jump") cy -= Math.abs(dalga) * 35;
  if (mod === "walk") cy -= Math.abs(Math.cos(frame * 0.2)) * 8;
  if (mod === "panic") cx += hizliDalga * 5; // Stresten titreme

  // 2. ÇÖP ADAM VÜCUDU VE HAREKETLERİ
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";

  // Gövde
  ctx.beginPath();
  ctx.moveTo(cx, cy - 35);
  ctx.lineTo(cx, cy + 55);
  ctx.stroke();

  // Bacaklar
  ctx.beginPath();
  if (mod === "exam") {
    // Sırada oturma pozisyonu
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx + 45, cy + 55);
    ctx.lineTo(cx + 45, cy + 125);
  } else if (mod === "walk") {
    // Adım atma
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx - dalga * 32, cy + 135);
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx + dalga * 32, cy + 135);
  } else if (mod === "jump") {
    // Havada açık bacaklar
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx - 35, cy + 125);
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx + 35, cy + 125);
  } else {
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx - 22, cy + 135);
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx + 22, cy + 135);
  }
  ctx.stroke();

  // Kollar (Her moda özel hareket)
  ctx.beginPath();
  if (mod === "exam") {
    // Masaya uzanıp kalemle yazı yazma + diğer elle kafayı tutma
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx + 55, cy + 25 + hizliDalga * 4);
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx - 42, cy - 65);
  } else if (mod === "flex") {
    // Pazu sıkma pozu
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx - 55, cy - 15);
    ctx.lineTo(cx - 45, cy - 60 - Math.abs(dalga) * 8);
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx + 55, cy - 15);
    ctx.lineTo(cx + 45, cy - 60 - Math.abs(dalga) * 8);
  } else if (mod === "panic") {
    // Elleri panikle havaya/yüze götürme
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx - 45, cy - 75 + hizliDalga * 6);
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx + 45, cy - 75 - hizliDalga * 6);
  } else if (mod === "jump") {
    // Sevinçle elleri yukarı sallama
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx - 55, cy - 85 + dalga * 15);
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx + 55, cy - 85 - dalga * 15);
  } else {
    // Dinamik konuşma ve el kol hareketleri
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx - 48, cy + 15 + dalga * 25);
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx + 48, cy + 15 - dalga * 25);
  }
  ctx.stroke();

  // Sınav moduysa önüne sıra ve sınav kağıdı çiz
  if (mod === "exam") {
    ctx.fillStyle = "#92400e";
    ctx.fillRect(cx + 25, cy + 25, 110, 14);
    ctx.fillRect(cx + 70, cy + 39, 14, 90);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(cx + 45, cy + 19, 45, 6);
  }

  // 3. KAFA VE DUYGU İFADELERİ
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(cx, cy - 75, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 5;
  ctx.stroke();

  // Gözler ve Kaşlar
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (mod === "exam" || mod === "panic") {
    // Stresli gözler ve ter damlası
    ctx.arc(cx - 13, cy - 80, 5, 0, Math.PI * 2);
    ctx.arc(cx + 13, cy - 80, 5, 0, Math.PI * 2);
    ctx.stroke();
    // Mavi ter damlası
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(cx - 48, cy - 85 + Math.abs(dalga) * 15, 6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.arc(cx - 13, cy - 80, 4, 0, Math.PI * 2);
    ctx.arc(cx + 13, cy - 80, 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Konuşan Ağız
  const agiz = Math.abs(Math.sin(frame * 0.45)) * 9 + 2;
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.ellipse(cx, cy - 58, 9, agiz / 2, 0, 0, Math.PI * 2);
  ctx.fill();
}

function renderPOVVideo(baslik, hikaye) {
  return new Promise(function(resolve) {
    const c = document.getElementById("cvs");
    const ctx = c.getContext("2d");
    const stream = c.captureStream(30);
    const rec = new MediaRecorder(stream);
    const chunks = [];
    const mod = sahneAnalizEt(baslik + " " + hikaye);
    rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = function() {
      const b = new Blob(chunks, { type: "video/webm" });
      resolve(URL.createObjectURL(b));
    };

    rec.start();
    let frame = 0;
    const toplamKare = 210;
    const kelimeler = hikaye.toUpperCase().split(" ");

    function ciz() {
      if (frame >= toplamKare) { rec.stop(); return; }

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 28px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      const baslikKelimeler = baslik.split(" ");
      let bSatir = "";
      let bY = 165;
      for (let i = 0; i < baslikKelimeler.length; i++) {
        const test = bSatir + baslikKelimeler.at(i) + " ";
        if (ctx.measureText(test).width > 440 && i > 0) {
          ctx.fillText(bSatir.trim(), c.width / 2, bY);
          bSatir = baslikKelimeler.at(i) + " ";
          bY += 36;
        } else {
          bSatir = test;
        }
      }
      ctx.fillText(bSatir.trim(), c.width / 2, bY);

      copAdamSahneCiz(ctx, frame, mod);

      const aktifIdx = Math.floor((frame / toplamKare) * kelimeler.length);
      const aktifAltYazi = kelimeler.slice(Math.max(0, aktifIdx - 1), aktifIdx + 2).join(" ");

      ctx.font = "900 30px Arial, sans-serif";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 7;
      ctx.strokeText(aktifAltYazi, c.width / 2, 645);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(aktifAltYazi, c.width / 2, 645);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 21px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Yeni partlar ve seriler için", c.width / 2, 765);
      ctx.fillText("takip etmeyi görüşlerinizi", c.width / 2, 795);
      ctx.fillText("yorumlara yazmayı", c.width / 2, 825);
      ctx.fillText("unutmayın", c.width / 2, 855);

      frame++;
      requestAnimationFrame(ciz);
    }
    ciz();
  });
}

async function povOlustur() {
  const hikaye = document.getElementById("storyText").value.trim();
  const girilenBaslik = document.getElementById("videoTitle").value.trim();
  if (!hikaye) { alert("Lütfen hikaye metnini yaz knk!"); return; }

  const baslik = girilenBaslik || hikaye.split(" ").slice(0, 5).join(" ") + " (Part 1)";
  const st = document.getElementById("status");
  const vidEl = document.getElementById("vid");
  const spBtn = document.getElementById("speakBtn");
  const dl = document.getElementById("dl");
  const btn = document.getElementById("btn");

  btn.disabled = true;
  vidEl.style.display = "none";
  spBtn.style.display = "none";
  dl.style.display = "none";
  okunacakMetin = baslik + ". " + hikaye;

  st.innerText = "Vortax AI istediğin sahneyi ve çöp adam hareketlerini oluşturuyor...";

  const videoUrl = await renderPOVVideo(baslik, hikaye);
  vidEl.src = videoUrl;
  vidEl.style.display = "block";
  spBtn.style.display = "block";
  dl.href = videoUrl;
  dl.style.display = "block";
  st.innerText = "POV Videon hazır! Oynatabilir, sesini dinleyebilir veya indirebilirsin.";

  dogalSesOku();
  btn.disabled = false;
}
</script>
</body>
</html>
