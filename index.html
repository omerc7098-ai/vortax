<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax AI - Viral POV Senaryo Video Üretici</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #09090b; color: #fff; display: flex; justify-content: center; padding: 15px; margin: 0; }
  .box { background: #141418; padding: 20px; border-radius: 18px; width: 100%; max-width: 440px; border: 1px solid #27272a; text-align: center; box-shadow: 0 10px 30px rgba(0,230,118,0.12); }
  h1 { color: #00e676; margin: 0 0 4px 0; font-size: 24px; letter-spacing: 1px; }
  .badge { display: inline-block; background: #00e67622; color: #00e676; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 12px; }
  p { color: #a1a1aa; font-size: 13px; margin: 0 0 15px 0; }
  input, select, textarea, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #27272a; background: #1f1f23; color: #fff; font-size: 14px; box-sizing: border-box; }
  button { background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 15px; }
  button:disabled { background: #3f3f46; color: #888; }
  .voice-btn { background: #ff9100; color: #000; display: none; margin-top: 8px; }
  .dl-btn { display: none; background: #2979ff; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 8px; font-size: 14px; }
  #status { margin-top: 10px; font-size: 13px; color: #ffab00; }
  video { width: 100%; max-width: 270px; aspect-ratio: 9/16; border-radius: 14px; margin: 15px auto 0 auto; display: none; border: 2px solid #27272a; background: #000; }
  canvas { display: none; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX AI STUDIO</h1>
  <div class="badge">VİRAL POV & SENARYO VİDEO ÜRETİCİ</div>
  <p>TikTok & Reels "Senaryo Vakti" tarzı animasyon videolar üret</p>

  <input type="text" id="videoTitle" placeholder="Başlık: Örn: Türk bir vücut geliştirmeci olsaydın (Part 1)" />

  <select id="characterStyle">
    <option value="gym">💪 Kaslı Sporcu / Vücut Geliştirmeci</option>
    <option value="student">🎒 Öğrenci / Sınav Stresi Karakteri</option>
    <option value="worker">💼 Çalışan / Patron Karakteri</option>
    <option value="normal">🧑 Günlük Mizah Karakteri</option>
  </select>

  <textarea id="storyText" rows="3" placeholder="Hikaye metni: Örn: Sabah uyandığın an ilk iş aynanın karşısına geçip kaslarına bakarak poz veriyorsun..."></textarea>

  <button id="btn" type="button" onclick="povVideoUret()">🎬 Viral POV Videosu Oluştur</button>

  <div id="status"></div>
  <canvas id="cvs" width="540" height="960"></canvas>
  <video id="vid" controls autoplay loop playsinline></video>
  <button id="speakBtn" type="button" class="voice-btn" onclick="sesOku()">🔊 Seslendirmeyi Tekrar Dinle</button>
  <a id="dl" class="dl-btn" download="vortax-pov-senaryo.webm">⬇️ TikTok / Reels Videosunu İndir</a>
</div>

<script>
let okunacakMetin = "";

function sesOku() {
  if (!okunacakMetin || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(okunacakMetin);
  u.lang = "tr-TR";
  u.rate = 1.02;
  window.speechSynthesis.speak(u);
}

function karakterCiz(ctx, cx, cy, frame, tip) {
  const nefes = Math.sin(frame * 0.15) * 4;
  const kolHareket = Math.sin(frame * 0.12) * 12;

  // Arka plan oda duvarı ve ayna (Ekran görüntüsündeki gibi pastel çizgi film odası)
  ctx.fillStyle = "#e8dfd5";
  ctx.fillRect(40, 260, 460, 420);

  // Oda penceresi
  ctx.fillStyle = "#bae6fd";
  ctx.fillRect(65, 290, 110, 140);
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 4;
  ctx.strokeRect(65, 290, 110, 140);

  // Boy Aynası (Sağ tarafta)
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(355, 310, 115, 310);
  ctx.strokeStyle = "#78350f";
  ctx.lineWidth = 8;
  ctx.strokeRect(355, 310, 115, 310);

  // Zemin
  ctx.fillStyle = "#d6c7b2";
  ctx.fillRect(40, 610, 460, 70);

  // 2D ÇİZGİ KARAKTER (Ekran görüntüsündeki stil)
  // Bacaklar & Şort
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(cx - 28, cy + 45, 56, 45);
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(cx - 14, cy + 90);
  ctx.lineTo(cx - 14, cy + 145);
  ctx.moveTo(cx + 14, cy + 90);
  ctx.lineTo(cx + 14, cy + 145);
  ctx.stroke();

  // Gövde (Atlet / Kıyafet)
  ctx.fillStyle = tip === "worker" ? "#334155" : "#64748b";
  ctx.beginPath();
  ctx.roundRect(cx - 32, cy - 35 - nefes, 64, 82 + nefes, 14);
  ctx.fill();
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Kollar (Poz verme veya hareket animasyonu)
  ctx.strokeStyle = "#fed7aa";
  ctx.lineWidth = tip === "gym" ? 14 : 10;
  ctx.lineCap = "round";
  ctx.beginPath();
  // Sol kol (Kas sıkma pozu)
  ctx.moveTo(cx - 32, cy - 22);
  ctx.lineTo(cx - 65, cy - 5);
  ctx.lineTo(cx - 52, cy - 42 + kolHareket * 0.4);
  // Sağ kol
  ctx.moveTo(cx + 32, cy - 22);
  ctx.lineTo(cx + 60, cy + 10 - kolHareket * 0.5);
  ctx.stroke();

  // Kafa (Büyük sevimli 2D çizgi kafa)
  ctx.fillStyle = "#ffedd5";
  ctx.beginPath();
  ctx.arc(cx, cy - 78 - nefes, 42, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Saç tutamı
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy - 120 - nefes);
  ctx.quadraticCurveTo(cx + 5, cy - 135 - nefes, cx + 14, cy - 118 - nefes);
  ctx.stroke();

  // Yüz İfadesi (Kaşlar, gözler ve konuşan ağız)
  ctx.lineWidth = 3;
  ctx.beginPath();
  // Kaşlar
  ctx.moveTo(cx - 22, cy - 92 - nefes);
  ctx.lineTo(cx - 8, cy - 87 - nefes);
  ctx.moveTo(cx + 22, cy - 92 - nefes);
  ctx.lineTo(cx + 8, cy - 87 - nefes);
  // Kısık/odaklanmış gözler
  ctx.moveTo(cx - 20, cy - 80 - nefes);
  ctx.lineTo(cx - 8, cy - 80 - nefes);
  ctx.moveTo(cx + 8, cy - 80 - nefes);
  ctx.lineTo(cx + 20, cy - 80 - nefes);
  ctx.stroke();

  // Konuşan ağız
  const agiz = Math.abs(Math.sin(frame * 0.4)) * 7 + 2;
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.ellipse(cx, cy - 60 - nefes, 8, agiz / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Aynadaki yansıma silüeti
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "#ffedd5";
  ctx.beginPath();
  ctx.arc(412, cy - 75, 32, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1.0;
}

function renderPOVVideo(baslik, hikaye, tip) {
  return new Promise(function(resolve) {
    const c = document.getElementById("cvs");
    const ctx = c.getContext("2d");
    const stream = c.captureStream(30);
    const rec = new MediaRecorder(stream);
    const chunks = [];

    rec.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = function() {
      const b = new Blob(chunks, { type: "video/webm" });
      resolve(URL.createObjectURL(b));
    };

    rec.start();
    let frame = 0;
    const toplamKare = 210; // 7 saniyelik TikTok POV videosu
    const kelimeler = hikaye.toUpperCase().split(" ");

    function ciz() {
      if (frame >= toplamKare) { rec.stop(); return; }

      // 1. Tam Siyah TikTok Arka Planı (Üst ve Alt Siyah Barlar)
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, c.width, c.height);

      // 2. Üst Kalın Beyaz Başlık (Ekran görüntüsündeki gibi)
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 28px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      const baslikKelimeler = baslik.split(" ");
      let bSatir = "";
      let bY = 165;
      for (let i = 0; i < baslikKelimeler.length; i++) {
        const test = bSatir + baslikKelimeler.at(i) + " ";
        if (ctx.measureText(test).width > 440 && i > 0) {
          ctx.fillText(bSatir.trim(), c.width / 2, bY);
          bSatir = baslikKelimeler.at(i) + " ";
          bY += 36;
        } else {
          bSatir = test;
        }
      }
      ctx.fillText(bSatir.trim(), c.width / 2, bY);

      // 3. Ortadaki 2D Çizgi Film Sahnesi
      karakterCiz(ctx, 235, 480, frame, tip);

      // 4. Sahnenin Altındaki Kalın Siyah Çerçeveli Beyaz Alt Yazı (Ekran görüntüsündeki gibi)
      const aktifIdx = Math.floor((frame / toplamKare) * kelimeler.length);
      const aktifAltYazi = kelimeler.slice(Math.max(0, aktifIdx - 1), aktifIdx + 2).join(" ");

      ctx.font = "900 30px Arial, sans-serif";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 7;
      ctx.strokeText(aktifAltYazi, c.width / 2, 645);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(aktifAltYazi, c.width / 2, 645);

      // 5. En Alttaki Takip / Yorum Çağrı Yazısı (Ekran görüntüsündeki gibi)
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 21px 'Segoe UI', Arial, sans-serif";
      ctx.fillText("Yeni partlar ve seriler için", c.width / 2, 765);
      ctx.fillText("takip etmeyi görüşlerinizi", c.width / 2, 795);
      ctx.fillText("yorumlara yazmayı", c.width / 2, 825);
      ctx.fillText("unutmayın", c.width / 2, 855);

      frame++;
      requestAnimationFrame(ciz);
    }
    ciz();
  });
}

async function povVideoUret() {
  const baslik = document.getElementById("videoTitle").value.trim() || "Türk bir vücut geliştirmeci olsaydın (Part 1)";
  const hikaye = document.getElementById("storyText").value.trim();
  const tip = document.getElementById("characterStyle").value;
  const st = document.getElementById("status");
  const vidEl = document.getElementById("vid");
  const spBtn = document.getElementById("speakBtn");
  const dl = document.getElementById("dl");
  const btn = document.getElementById("btn");

  if (!hikaye) { alert("Lütfen hikaye metnini yaz knk!"); return; }

  btn.disabled = true;
  vidEl.style.display = "none";
  spBtn.style.display = "none";
  dl.style.display = "none";
  okunacakMetin = baslik + ". " + hikaye;

  st.innerText = "Vortax AI viral POV videosunu ve seslendirmesini hazırlıyor (7 saniye)...";

  const videoUrl = await renderPOVVideo(baslik, hikaye, tip);
  vidEl.src = videoUrl;
  vidEl.style.display = "block";
    spBtn.style.display = "block";
  dl.href = videoUrl;
  dl.style.display = "block";
  st.innerText = "POV Videon hazır! İndirip doğrudan TikTok veya Reels'e yükleyebilirsin.";

  sesOku();
  btn.disabled = false;
}
</script>
</body>
</html>
