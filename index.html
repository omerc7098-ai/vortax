<!DOCTYPE html>
<html lang="tr">
<head>

    <style>

        img, video { width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
        .script-box { display: none; background-color: #222; padding: 14px; border-radius: 10px; margin-top: 15px; text-align: left; font-size: 14px; line-height: 1.5; color: #e0e0e0; border-left: 3px solid #00e676; }

<body>

<div class="container">
    <h1>VORTAX AI STUDIO</h1>
    <p>Görsel, Sinematik Video ve Çok Dilli Seslendirme</p>
    
    <select id="mode">
        <option value="video_voice">🎬 Sinematik Video + Seslendirme Üret</option>
        <option value="image_only">🖼️ Sadece Yüksek Çözünürlüklü Görsel Üret</option>
    </select>

    <select id="language">
        <option value="tr-TR">🇹🇷 Türkçe</option>
        <option value="en-US">🇺🇸 English</option>
        <option value="es-ES">🇪🇸 Español</option>
        <option value="de-DE">🇩🇪 Deutsch</option>
        <option value="fr-FR">🇫🇷 Français</option>
        <option value="ar-SA">🇸🇦 العربية</option>
        <option value="ru-RU">🇷🇺 Русский</option>
    </select>

    <textarea id="prompt" rows="4" placeholder="Örn: Yağmurlu bir gecede neon ışıklı Tokyo sokaklarında yürüyen siberpunk bir samuray..."></textarea>
    
    <button id="generateBtn">Vortax ile Oluştur</button>
    
    <div id="status"></div>
    <canvas id="videoCanvas" width="720" height="720"></canvas>
    <video id="outputVideo" controls autoplay loop playsinline></video>
    <img id="outputImage" alt="Vortax AI Görseli" />
    <div id="scriptBox" class="script-box"></div>
    
    <button id="speakBtn" class="voice-btn">🔊 Seslendirmeyi Dinle / Tekrar Oynat</button>
    <a id="downloadLink" class="download-btn" download="vortax-ai-medya">⬇️ Cihaza İndir</a>
</div>

<script>
    // GEMINI API ANAHTARINI TIRNAKLARIN İÇİNE YAPIŞTIR
    const GEMINI_API_KEY = "AQ.Ab8RN6KHL7IMnLv61W_C4PtRqF5PcBZV_23dP9-Ic1IlbxeuRQ"; 
    let currentNarration = "";

    function speakText(text, langCode) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        utterance.rate = 0.95;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    // Görselden sinematik hareketli video dosyası (Zoom-in kamera efekti) üreten motor
    function createVideoFromImage(imgElement) {
        return new Promise((resolve) => {
            const canvas = document.getElementById("videoCanvas");
            const ctx = canvas.getContext("2d");
            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                resolve(URL.createObjectURL(blob));
            };

            recorder.start();
            let frame = 0;
            const totalFrames = 150; // 5 saniyelik 30 FPS sinematik video

            function drawFrame() {
                if (frame >= totalFrames) {
                    recorder.stop();
                    return;
                }
                const scale = 1 + (frame / totalFrames) * 0.18; // Sinematik yakınlaşma (Ken Burns efekti)
                const w = canvas.width * scale;
                const h = canvas.height * scale;
                const x = (canvas.width - w) / 2;
                const y = (canvas.height - h) / 2;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(imgElement, x, y, w, h);
                frame++;
                requestAnimationFrame(drawFrame);
            }
            drawFrame();
        });
    }

    document.getElementById("speakBtn").addEventListener("click", function() {
        const langCode = document.getElementById("language").value;
        if (currentNarration) speakText(currentNarration, langCode);
    });

    document.getElementById("generateBtn").addEventListener("click", async function() {
        const promptText = document.getElementById("prompt").value.trim();
        const mode = document.getElementById("mode").value;
        const langSelect = document.getElementById("language");
        const langCode = langSelect.value;
        const langName = langSelect.options.at(langSelect.selectedIndex).text;
        
        const statusDiv = document.getElementById("status");
        const imageElement = document.getElementById("outputImage");
        const videoElement = document.getElementById("outputVideo");
        const scriptBox = document.getElementById("scriptBox");
        const speakBtn = document.getElementById("speakBtn");
        const downloadLink = document.getElementById("downloadLink");
        const btn = this;

        if (!promptText) {
            alert("Lütfen bir metin yazın!");
            return;
        }

        const cleanKey = GEMINI_API_KEY.trim();
        if (!cleanKey) {
            statusDiv.innerText = "Hata: Kodun içine Gemini API anahtarını yapıştırmamışsın!";
            return;
        }

        btn.disabled = true;
        imageElement.style.display = "none";
        videoElement.style.display = "none";
        scriptBox.style.display = "none";
        speakBtn.style.display = "none";
        downloadLink.style.display = "none";
        window.speechSynthesis.cancel();

        try {
            statusDiv.innerText = "1/3: Vortax AI sahne görselini çiziyor...";
            
            // 1. Adım: Görseli Üret (Gemini 2.5 Flash Image)
            const imgResponse = await fetch("https://googleapis.com" + cleanKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: "Create a stunning, cinematic, ultra-detailed widescreen image for this scene: " + promptText }]
                    }]
                })
            });

            const imgData = await imgResponse.json();
            if (!imgResponse.ok) {
                throw new Error((imgData.error && imgData.error.message) ? imgData.error.message : "Görsel motoru yanıt vermedi.");
            }

            const firstCand = imgData.candidates ? imgData.candidates.at(0) : null;
            const parts = (firstCand && firstCand.content && firstCand.content.parts) ? firstCand.content.parts : [];
            const imagePart = parts.find(function(p) { return p.inlineData; });

            if (!imagePart || !imagePart.inlineData) {
                throw new Error("Görsel oluşturulamadı, lütfen sahneyi biraz daha farklı tarif et.");
            }

            const fullImgUrl = "data:" + (imagePart.inlineData.mimeType || "image/png") + ";base64," + imagePart.inlineData.data;

            if (mode === "image_only") {
                imageElement.src = fullImgUrl;
                imageElement.style.display = "block";
                downloadLink.href = fullImgUrl;
                downloadLink.download = "vortax-gorsel.png";
                downloadLink.style.display = "block";
                statusDiv.innerText = "Görsel hazır!";
                btn.disabled = false;
                return;
            }

            // 2. Adım: Seçilen dilde video dış ses metni yaz (Gemini 2.5 Flash)
            statusDiv.innerText = "2/3: Vortax " + langName + " seslendirme metnini yazıyor...";
            const textResponse = await fetch("https://googleapis.com" + cleanKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: "Bu sahne için (" + langName + " dilinde) sadece 2 cümlelik, çok etkileyici bir belgesel/film dış ses (voiceover) anlatımı yaz. Başlık veya ekstra açıklama ekleme, sadece okunacak metni ver: " + promptText }]
                    }]
                })
            });
            const textData = await textResponse.json();
