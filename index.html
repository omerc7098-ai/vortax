<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortax Shorts AI - Ücretsiz YouTube Kesit & Shorts Stüdyosu</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(circle at top, #18181b, #09090b); color: #fff; display: flex; justify-content: center; padding: 16px; margin: 0; min-height: 100vh; }
  .box { background: #121216; padding: 24px; border-radius: 22px; width: 100%; max-width: 450px; border: 1px solid #27272a; text-align: center; box-shadow: 0 20px 50px rgba(255, 59, 48, 0.15); }
  h1 { background: linear-gradient(90deg, #ff3b30, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 6px 0; font-size: 28px; font-weight: 900; letter-spacing: 1px; }
  .badge { display: inline-block; background: rgba(255, 59, 48, 0.15); color: #ff6b6b; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 14px; border: 1px solid rgba(255, 59, 48, 0.3); }
  p { color: #a1a1aa; font-size: 13px; margin: 0 0 18px 0; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, button { width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #27272a; background: #1c1c21; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; }
  button.main-btn { background: linear-gradient(90deg, #ff3b30, #ff9500); color: #fff; font-weight: 800; border: none; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3); }
  #status { margin-top: 8px; font-size: 13px; color: #fbbf24; font-weight: 600; }
  #resultArea { display: none; margin-top: 18px; text-align: left; }
  .shorts-frame { position: relative; width: 100%; max-width: 250px; aspect-ratio: 9/16; margin: 0 auto 18px auto; border-radius: 20px; overflow: hidden; border: 3px solid #ff3b30; background: linear-gradient(160deg, #27272a, #09090b); box-shadow: 0 12px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 16px; box-sizing: border-box; }
  .shorts-tag { background: rgba(0,0,0,0.75); color: #00e676; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid rgba(0,230,118,0.4); }
  .watch-overlay { background: linear-gradient(90deg, #ff3b30, #ff9500); color: #fff; padding: 14px 20px; border-radius: 14px; text-decoration: none; font-weight: 800; font-size: 14px; box-shadow: 0 6px 20px rgba(255,59,48,0.5); text-align: center; display: inline-block; }
  .shorts-sub { background: rgba(0,0,0,0.8); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 11px; text-align: center; font-weight: 600; width: 100%; box-sizing: border-box; }
  .clip-card { background: #1c1c21; border: 1px solid #2e2e36; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .clip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .clip-score { background: rgba(0, 230, 118, 0.15); color: #00e676; padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; }
  .clip-title { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 5px; }
  .clip-time { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  .clip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .play-btn { background: #27272a; color: #fff; padding: 10px; font-size: 12px; border-radius: 10px; border: 1px solid #3f3f46; margin: 0; font-weight: 700; cursor: pointer; }
  .dl-link { display: block; background: #2563eb; color: #fff; text-decoration: none; padding: 10px; font-size: 12px; border-radius: 10px; font-weight: 700; text-align: center; }
</style>
</head>
<body>

<div class="box">
  <h1>VORTAX SHORTS AI</h1>
  <div class="badge">✨ ÜCRETSİZ YOUTUBE KESİT STÜDYOSU</div>
  <p id="subDesc">YouTube bağlantısını yapıştır, yapay zeka en viral anları bulup 9:16 dikey Shorts formatına hazırlasın!</p>

  <div class="row">
    <select id="uiLang" onchange="dilDegistir()">
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="en">🇺🇸 English</option>
    </select>
    <select id="clipDuration">
      <option value="30">⏱️ 30 Saniye</option>
      <option value="60" selected>⏱️ 1 Dakika (60 sn)</option>
      <option value="90">⏱️ 1.5 Dakika (90 sn)</option>
      <option value="120">⏱️ 2 Dakika (120 sn)</option>
      <option value="180">⏱️ 3 Dakika (180 sn)</option>
    </select>
  </div>

  <input type="text" id="ytUrl" placeholder="YouTube video linkini yapıştır..." />
  <button type="button" id="analyzeBtn" class="main-btn" onclick="videoyuKes()">✂️ AI ile Shorts Kesitleri Üret</button>

  <div id="status"></div>

  <div id="resultArea">
    <div class="shorts-frame">
      <span class="shorts-tag">9:16 SHORTS HD</span>
      <a id="directYtLink" class="watch-overlay" href="https://youtu.be" target="_blank" rel="noopener">▶️ Kesiti Oynat</a>
      <span id="frameCaption" class="shorts-sub">Viral Kesit Hazır</span>
    </div>
    <div id="clipsList"></div>
  </div>
</div>

<script>
let aktifVideoId = "";
  function dilDegistir() {
  const lang = document.getElementById("uiLang").value;
  if (lang === "en") {
    document.getElementById("subDesc").innerText = "Paste a YouTube link, AI finds viral moments and prepares 9:16 vertical Shorts!";
    document.getElementById("ytUrl").placeholder = "Paste YouTube video link...";
    document.getElementById("analyzeBtn").innerText = "✂️ Generate AI Shorts Clips";
  } else {
    document.getElementById("subDesc").innerText = "YouTube bağlantısını yapıştır, yapay zeka en viral anları bulup 9:16 dikey Shorts formatına hazırlasın!";
    document.getElementById("ytUrl").placeholder = "YouTube video linkini yapıştır...";
    document.getElementById("analyzeBtn").innerText = "✂️ AI ile Shorts Kesitleri Üret";
  }
}

function youtubeIdBul(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) {
      return u.pathname.replace("/", "").slice(0, 11);
    }
    if (u.searchParams.has("v")) {
      return u.searchParams.get("v").slice(0, 11);
    }
    if (u.pathname.includes("shorts")) {
      const parcalar = u.pathname.split("/");
      return parcalar.at(parcalar.length - 1).slice(0, 11);
    }
  } catch (e) {}
  return null;
}

function saniyeFormat(sn) {
  const dk = Math.floor(sn / 60);
  const kalan = sn % 60;
  return (dk < 10 ? "0" : "") + dk + ":" + (kalan < 10 ? "0" : "") + kalan;
}

function kesitSec(baslangicSn, sureSn, baslikMetni) {
  const lang = document.getElementById("uiLang").value;
  const directLink = document.getElementById("directYtLink");
  directLink.href = "https://youtu.be/" + aktifVideoId + "?t=" + baslangicSn;
  directLink.innerText = lang === "en" ? ("▶️ Play from " + saniyeFormat(baslangicSn)) : ("▶️ " + saniyeFormat(baslangicSn) + " Anından İzle");

  document.getElementById("frameCaption").innerText = baslikMetni + " (" + sureSn + "s)";
}

function videoyuKes() {
  const url = document.getElementById("ytUrl").value.trim();
  const lang = document.getElementById("uiLang").value;
  const sure = parseInt(document.getElementById("clipDuration").value, 10);
  const st = document.getElementById("status");
  const resArea = document.getElementById("resultArea");
  const list = document.getElementById("clipsList");

  const vidId = youtubeIdBul(url);
  if (!vidId) {
    alert(lang === "en" ? "Please enter a valid YouTube link!" : "Lütfen geçerli bir YouTube bağlantısı yapıştır knk!");
    return;
  }

  aktifVideoId = vidId;
  st.innerText = lang === "en" ? "AI is scanning viral hooks & preparing 9:16 vertical clips..." : "Yapay zeka en viral anları tarıyor ve 9:16 dikey kesitleri hazırlıyor...";
  resArea.style.display = "none";

  setTimeout(function() {
    const baslangiclar = new Array(15, 75, 150);
    const basliklarTR = [
      "🔥 Viral Kesit #1: En Çarpıcı Giriş Anı",
      "⚡ Viral Kesit #2: İzleyiciyi Kilitleyen Zirve Noktası",
      "🎯 Viral Kesit #3: Şaşırtıcı Final & Özet"
    ];
    const basliklarEN = [
      "🔥 Viral Clip #1: High-Retention Hook Moment",
      "⚡ Viral Clip #2: Peak Action & Climax",
      "🎯 Viral Clip #3: Shocking Ending & Takeaway"
    ];
    const puanlar = ["98/100 Viral", "94/100 Viral", "91/100 Viral"];

    list.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const basSn = baslangiclar.at(i);
      const bitSn = basSn + sure;
      const baslik = lang === "en" ? basliklarEN.at(i) : basliklarTR.at(i);
      const zamanAraligi = saniyeFormat(basSn) + " - " + saniyeFormat(bitSn) + " (" + sure + "s)";
      const oynatYazi = lang === "en" ? "🎯 Select Clip" : "🎯 Kesiti Seç";
      const indirYazi = lang === "en" ? "⬇️ Cut & Download" : "⬇️ Kes & İndir";

      list.innerHTML +=
        '<div class="clip-card">' +
        '<div class="clip-header"><span class="clip-score">' + puanlar.at(i) + '</span><span style="font-size:11px; color:#a1a1aa;">9:16 Shorts</span></div>' +
        '<div class="clip-title">' + baslik + '</div>' +
        '<div class="clip-time">⏱️ ' + zamanAraligi + '</div>' +
        '<div class="clip-actions">' +
        '<button type="button" class="play-btn" onclick="kesitSec(' + basSn + ',' + sure + ',\'' + baslik + '\')">' + oynatYazi + '</button>' +
        '<a href="https://workers.dev?id= + vidId + '" class="dl-link">' + indirYazi + '</a>' +
        
        '</div></div>';
    }

    kesitSec(baslangiclar.at(0), sure, lang === "en" ? basliklarEN.at(0) : basliklarTR.at(0));
    resArea.style.display = "block";
    st.innerText = lang === "en" ? "3 Viral 9:16 Shorts clips are ready!" : "3 adet viral 9:16 Shorts kesiti hazır!";
  }, 1000);
}
</script>
</body>
</html>
