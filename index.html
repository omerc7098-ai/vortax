<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortax AI - Ücretsiz Video & Görsel Üretici</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d0d0d; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #1a1a1a; padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0, 230, 118, 0.15); border: 1px solid #2a2a2a; text-align: center; }
        h1 { font-size: 26px; margin-bottom: 5px; color: #00e676; letter-spacing: 1px; }
        p { font-size: 14px; color: #b0b0b0; margin-bottom: 20px; }
        select, textarea, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background-color: #262626; color: white; font-size: 16px; box-sizing: border-box; }
        button { background-color: #00e676; color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00c853; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #ffab00; line-height: 1.4; }
        video, img { width: 100%; border-radius: 10px; margin-top: 20px; display: none; }
        .download-btn { display: none; background-color: #2979ff; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>VORTAX AI</h1>
    <p>İstediğin dilde yaz, Vortax yapay zekası anında oluştursun.</p>
    
    <select id="mode">
        <option value="video">🎬 Metinden Video Üret (MP4)</option>
        <option value="image">🖼️ Metinden Görsel Üret (Hızlı HD)</option>
    </select>

    <select id="language">
        <option value="Türkçe">Türkçe</option>
        <option value="English">English</option>
        <option value="Español">Español</option>
        <option value="Deutsch">Deutsch</option>
        <option value="Français">Français</option>
        <option value="العربية">العربية</option>
        <option value="Русский">Русский</option>
        <option value="Diğer (Otomatik Algıla)">Diğer Tüm Diller (Otomatik)</option>
    </select>

    <textarea id="prompt" rows="4" placeholder="Örn: Uzayda kaykay yapan bir kedi, sinematik ışıklandırma..."></textarea>
    
    <button id="generateBtn" onclick="generateMedia()">Vortax ile Oluştur</button>
    
    <div id="status"></div>
    <video id="outputVideo" controls autoplay loop playsinline></video>
    <img id="outputImage" alt="Vortax AI Çıktısı" />
    <a id="downloadLink" class="download-btn" download="vortax-ai-sonuc">⬇️ Cihaza İndir</a>
</div>

<script>
    // GEMINI API ANAHTARINI TIRNAKLARIN İÇİNE YAPIŞTIR (Boş kalsa da sistem artık hata vermez)
    const GEMINI_API_KEY = "AQ.Ab8RN6KHL7IMnLv61W_C4PtRqF5PcBZV_23dP9-Ic1IlbxeuRQ"; 

    async function translateToEnglish(text) {
        if (!GEMINI_API_KEY) return text;
        try {
            const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Translate the following prompt into detailed English for an AI generator. Return ONLY the English translation, nothing else: "${text}"` }] }]
                })
            });
            if (!response.ok) return text;
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || text;
        } catch (e) {
            // Çeviri servisi ağ engeline takılırsa süreci durdurma, metni doğrudan aktar
            return text;
        }
    }

    async function generateMedia() {
        const promptText = document.getElementById("prompt").value.trim();
        const mode = document.getElementById("mode").value;
        const statusDiv = document.getElementById("status");
        const videoElement = document.getElementById("outputVideo");
        const imageElement = document.getElementById("outputImage");
        const downloadLink = document.getElementById("downloadLink");
        const btn = document.getElementById("generateBtn");

        if (!promptText) {
            alert("Lütfen bir metin yazın!");
            return;
        }

        btn.disabled = true;
        videoElement.style.display = "none";
        imageElement.style.display = "none";
        downloadLink.style.display = "none";
        statusDiv.innerText = "1/2: Vortax metni yapay zeka için hazırlıyor...";

        const englishPrompt = await translateToEnglish(promptText);
        const encodedPrompt = encodeURIComponent(englishPrompt);
        const randomSeed = Math.floor(Math.random() * 100000);

        if (mode === "image") {
            statusDiv.innerText = "2/2: Vortax yüksek çözünürlüklü görseli çiziyor (5-10 saniye)...";
            const imgUrl = `https://pollinations.ai{encodedPrompt}?width=1024&height=1024&seed=${randomSeed}&nologo=true`;
            
            imageElement.onload = () => {
                imageElement.style.display = "block";
                downloadLink.href = imgUrl;
                downloadLink.download = "vortax-gorsel.jpg";
                downloadLink.style.display = "block";
                statusDiv.innerText = "Görsel hazır!";
                btn.disabled = false;
            };
            imageElement.onerror = () => {
                statusDiv.innerText = "Görsel sunucusu şu an yoğun, lütfen tekrar dene.";
                btn.disabled = false;
            };
            imageElement.src = imgUrl;

        } else {
            statusDiv.innerText = "2/2: Vortax videoyu işliyor (30-60 saniye sürebilir, lütfen sayfadan çıkma)...";
            const videoUrl = `https://pollinations.ai{encodedPrompt}?seed=${randomSeed}&nologo=true`;
            
            videoElement.onloadeddata = () => {
                videoElement.style.display = "block";
                downloadLink.href = videoUrl;
                downloadLink.download = "vortax-video.mp4";
                downloadLink.style.display = "block";
                statusDiv.innerText = "Video hazır!";
                btn.disabled = false;
            };
            videoElement.onerror = () => {
                statusDiv.innerText = "Ücretsiz video sunucusu şu an dolu. Üstteki menüden 'Metinden Görsel Üret' seçeneğini hemen kullanabilirsin!";
                btn.disabled = false;
            };
            videoElement.src = videoUrl;
        }
    }
</script>

</body>
</html>
